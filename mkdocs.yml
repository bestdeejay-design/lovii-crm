# MkDocs configuration — документация платформы lovii
# Публикуется на GitHub Actions → GitHub Pages (.github/workflows/pages.yml)

site_name: lovii — платформа ресторанного бизнеса
site_description: Исследование, аудит аналогов и продуктовые спецификации ресторанной CRM/ERP платформы полного цикла
site_url: https://bestdeejay-design.github.io/lovii-crm/
repo_url: https://github.com/bestdeejay-design/lovii-crm
repo_name: bestdeejay-design/lovii-crm
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.top
    - navigation.path
    - toc.follow
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  generator: false

nav:
  - Главная: README.md
  - Резюме и аудит:
    - Резюме исследования: research/executive-summary.md
