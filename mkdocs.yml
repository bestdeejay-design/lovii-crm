    - "Терминология: франшиза и франчайзинг": research/terminology-franchise.md
    - "Программа разборов (статус)": research/academic-research-agenda.md
    - "Разбор 1: управленческий учёт общепита": research/academic/01-management-accounting.md
    - "Разбор 2: юнит-экономика точки": research/academic/02-unit-economics.md
