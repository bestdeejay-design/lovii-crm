name: Docs → GitHub Pages

# Собирает документацию (MkDocs Material) и публикует её в корень ветки.
# Страницы репозитория отдают корень ветки напрямую, поэтому сайт доступен на
# https://bestdeejay-design.github.io/lovii-crm/ без изменения настроек репозитория.
# Файл .nojekyll отключает Jekyll — файлы отдаются как есть.

on:
  push:
    branches: [main, "arena/3e31bd7c-lovii-crm"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install --quiet mkdocs-material

      - name: Build docs
        run: mkdocs build

      - name: Add non-MkDocs pages to sitemap
        run: |
          python3 - <<'EOF'
          import gzip, re, datetime
          path = "site/sitemap.xml"
          xml = open(path, encoding="utf-8").read()
          m = re.search(r"<loc>(https://[^<]*?/lovii-crm/)</loc>", xml)
          base = m.group(1) if m else "https://bestdeejay-design.github.io/lovii-crm/"
          today = datetime.date.today().isoformat()
          extra = ""
          for rel in ["demo/", "pilot/"]:
              loc = base + rel
              if f"<loc>{loc}</loc>" not in xml:
                  extra += f"<url><loc>{loc}</loc><lastmod>{today}</lastmod></url>"
          if extra:
              xml = xml.replace("</urlset>", extra + "</urlset>")
              open(path, "w", encoding="utf-8").write(xml)
              gzip.open("site/sitemap.xml.gz", "wt", encoding="utf-8").write(xml)
              print("sitemap extended:", extra)
          EOF

      - name: Publish built site to branch root
        run: |
          # убираем ранее сгенерированные файлы сайта в корне (но не исходники)
          rm -rf index.html 404.html assets javascripts stylesheets search research sitemap.xml sitemap.xml.gz
          cp -r site/. .
          touch .nojekyll
          git config user.name "lovii docs bot"
          git config user.email "lovii-docs-bot@users.noreply.github.com"
          git add -A -- index.html 404.html assets javascripts stylesheets search research sitemap.xml sitemap.xml.gz .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "docs(site): publish built documentation"
            git push
          else
            echo "Site unchanged — nothing to publish."
          fi
